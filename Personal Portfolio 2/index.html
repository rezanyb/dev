<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reza NYB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="main-header">
      <nav class="navbar header-nav navbar-expand-lg">
        <div class="container">
          <!-- Brand Name/Logo -->
          <a href="#" class="navbar-brand">
            <h4 class="mb-0">Reza <span class="text-primary">NYB</span></h4>
          </a>

          <!-- Menu -->
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbar-collapse-toggle"
          >
            <ul class="navbar-nav mx-auto">
              <li>
                <a href="#home" class="nav-link">Home</a>
              </li>
              <li>
                <a href="#about" class="nav-link">About Me</a>
              </li>
              <li>
                <a href="#services" class="nav-link">Services</a>
              </li>
              <li>
                <a href="#skill" class="nav-link">Skills</a>
              </li>
              <li>
                <a href="#portfolio" class="nav-link">Portfolio</a>
              </li>
            </ul>
          </div>

          <!-- Button -->
          <div class="ms-auto d-none d-lg-block">
            <a class="colored-btn" href="" class="contact">Contact Now</a>
          </div>
          <!-- Mobile Menu Toggle -->
          <button
            class="navbar-toggler collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar-collapse-toggle"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Main -->
    <main>
      <!-- Home -->
      <section id="home" class="home-section bg-gray">
        <div class="container">
          <div class="anim-elements">
            <div class="anim-element"><i class="bx bxl-html5"></i></div>
            <div class="anim-element"><i class="bx bxl-css3"></i></div>
            <div class="anim-element"><i class="bx bxl-react"></i></div>
            <div class="anim-element"><i class="bx bxl-android"></i></div>
            <div class="anim-element"><i class="bx bxl-apple"></i></div>
          </div>
          <div class="row gy-5 align-items-center">
            <div class="col-lg-6">
              <div class="home-intro text-center text-lg-start">
                <h6>Hi, My name is Reza.</h6>
                <h1>I'm <span id="type-it"></span></h1>
                <p>Based in Mashhad.</p>
                <a href="#about" class="colored-btn mt-1"> About Me </a>
              </div>
            </div>
            <div class="col-lg-6 pt-4 pt-lg-0">
              <div class="home-image text-center">
                <img src="assets/img/pic.JPG" alt="" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/jquery/jquery-4.0.0.min.js"></script>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
